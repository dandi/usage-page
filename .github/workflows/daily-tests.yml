name: Daily tests

on:
    schedule:
        - cron: "0 12 * * *"
    workflow_dispatch:

jobs:
    tests:
        uses: ./.github/workflows/test.yml
        secrets: inherit
        permissions:
            contents: read

    # The deployed site over live data, which the tests
    # above stand in for; see configs/playwright.live.config.js.
    live-site:
        name: Live site (Playwright)
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install chromium --with-deps

            - name: Check the live site
              run: npx playwright test --config configs/playwright.live.config.js

            - name: Upload the report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: live-site-report
                  path: playwright-report-live/
                  retention-days: 14

    notify-on-failure:
        runs-on: ubuntu-latest
        needs: [tests, live-site]
        if: failure()
        permissions: {}
        steps:
            - uses: dawidd6/action-send-mail@v22
              with:
                  server_address: smtp.gmail.com
                  server_port: 465
                  username: ${{ secrets.MAIL_USERNAME }}
                  password: ${{ secrets.MAIL_PASSWORD }}
                  subject: "CI Failure: `usage-page` Daily tests"
                  to: cody.c.baker.phd@gmail.com
                  from: usage-page
                  body: |
                      The daily test run for the usage-page repository has failed.

                      Tests:      ${{ needs.tests.result }}
                      Live site:  ${{ needs.live-site.result }}

                      Please review the workflow run at https://github.com/dandi/usage-page/actions/workflows/daily-tests.yml
