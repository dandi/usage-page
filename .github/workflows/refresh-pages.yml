name: Refresh pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CARTO requires an API key for the region map's basemap. It is not a
      # secret, since it ends up in the page, so it is kept as a variable.
      - name: Build site
        run: npm run build
        env:
          CARTO_API_KEY: ${{ vars.CARTO_API_KEY }}

      # Leaves `pr-preview/` alone, which holds the open pull requests'
      # previews, and rebases rather than force-pushes so that a preview
      # deployed meanwhile is not lost.
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
